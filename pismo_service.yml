openapi: '3.0.3'
info:
  title: Pismo example service
  version: '1.0'
  description: This is a sample pismo service. Not intended for production use.
servers:
  - url: https://api.server.test/demo/v1
    description: Demo api server
components:
    schemas:
      Account:
        type: object
        required:
          - document_number
        properties:
          document_number:
            type: string
            format: uuid
      OperationType:
        type: number
        enum: [1, 2, 3, 4]
        example: 4
      Transaction:
        type: object
        required:
          - account_id
          - operation_type_id
          - amount
        properties:
          account_id:
            type: integer
          operation_type_id:
            $ref: '#/components/schemas/OperationType'
          amount:
            type: number
            format: float
paths:
  /accounts/{accountId}:
    get:
      summary: Get Account by ID
      operationId: getAccountById
      parameters:
        - in: path
          name: accountId
          required: true
          schema:
            type: integer
          description: Id of the account to retrieve
      responses:
        '200':
          description: A single account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '404':
          description: Account not found
  /accounts/:
    post:
      summary: Create new Account
      operationId: createAccount
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - document_number
              properties:
                document_number:
                  type: string
                  format: uuid
      responses:
        '201':
          description: Account create successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '400':
          description: Invalid request
        '401':
          description: Unauthorized
  /transactions:
    post:
      summary: Create new Transaction
      operationId: createTransaction
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - account_id
                - operation_type_id
                - amount
              properties:
                account_id:
                  type: integer
                operation_type_id:
                  $ref: "#/components/schemas/OperationType"
                amount:
                  type: number
                  format: float
      responses:
        '201':
          description: Transaction created successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transaction'
        '400':
          description: Invalid request
        '401':
          description: Unauthorized






